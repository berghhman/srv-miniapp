<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e12">
<meta name="format-detection" content="telephone=no">
<title>SRV Detailing</title>
<meta name="description" content="Детейлинг-центр SRV, Санкт-Петербург, ул. Симонова, 11: защитная плёнка, керамика, тонировка, полировка, химчистка. Расчёт и онлайн-запись.">
<link rel="icon" href="img/avatar.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column Telegram mini app, 4 tabs + bottom sheets; showroom-dark garage look with SRV red */
:root{
  --bg:#0c0e12; --surface:#14171d; --surface2:#1b1f27; --line:#272c36;
  --fg:#eef0f4; --muted:#8a92a2; --dim:#5d6575;
  --accent:#e3262f; --accent-2:#ff4d55; --accent-soft:rgba(227,38,47,.14);
  --film:#a9dcff; --ok:#3ccf8d; --warn:#f5b546;
  --paint:#d9dde4; --glass:#1a2230;
  --f-display:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --paper:#0f1319; --ink:#8592a8; --ink-dim:#4e586a; --panel:#1a1f28;
  --r:16px; --r-s:10px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--fg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
.screen{display:flex;flex-direction:column;gap:22px;padding-top:14px;animation:in .35s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff5a61,var(--accent) 55%,#8f1016);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.04em;box-shadow:0 0 0 3px rgba(227,38,47,.18)}
.brand b{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.06em;display:block;line-height:1}
.brand small{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.brand{min-width:0}.brand>div{min-width:0}
.brand b,.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;letter-spacing:.08em}
.status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:7px 11px;border-radius:99px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(60,207,141,.18)}
.dot.off{background:var(--warn);box-shadow:0 0 0 3px rgba(245,181,70,.18)}

/* hero */
.hero{position:relative;border-radius:22px;overflow:hidden;background:radial-gradient(120% 90% at 80% 0%,#262b36 0%,#14171d 55%,#0f1116 100%);border:1px solid var(--line);padding:20px 18px 16px}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,7.4vw,34px);line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--accent-2)}
.hero p{margin:8px 0 0;color:var(--muted);max-width:30ch}
.car-side{display:block;width:100%;height:auto;margin:6px 0 2px}
.sweep{animation:sweep 4.2s cubic-bezier(.6,0,.3,1) infinite}
@keyframes sweep{0%{transform:translateX(-260px)}60%,100%{transform:translateX(420px)}}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hs{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.hs b{font-family:var(--f-display);font-size:19px;display:block;line-height:1.1}
.hs span{font-size:11.5px;color:var(--muted);line-height:1.25;display:block}
.hero-cta{display:flex;gap:8px;margin-top:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;transition:transform .12s,background .2s;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-red{background:var(--accent);color:#fff;box-shadow:0 8px 22px -10px rgba(227,38,47,.8)}
.btn-red:hover{background:var(--accent-2)}
.btn-ghost{background:var(--surface2);border:1px solid var(--line)}
.btn-wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* section titles */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0;letter-spacing:.01em}
.sec-h a,.sec-h button{color:var(--muted);font-size:13px;text-decoration:none}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* promo */
.promo{position:relative;border-radius:var(--r);padding:16px;background:linear-gradient(135deg,#2a0d10 0%,#1a0f12 60%,#14171d 100%);border:1px solid rgba(227,38,47,.35);overflow:hidden}
.promo::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(227,38,47,.35),transparent 70%)}
.promo .tag{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#ffb3b6;background:rgba(227,38,47,.18);padding:4px 8px;border-radius:6px}
.promo h3{font-family:var(--f-display);font-size:19px;margin:10px 0 2px;line-height:1.15}
.promo .price{font-family:var(--f-display);font-size:30px;font-weight:700;color:#fff}
.promo .price s{font-size:15px;color:var(--muted);font-weight:500;margin-left:6px}
.cd{display:flex;gap:6px;margin:12px 0}
.cd div{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:9px;min-width:54px;padding:6px 4px;text-align:center}
.cd b{font-family:var(--f-display);font-size:20px;display:block;line-height:1.1}
.cd span{font-size:10.5px;color:var(--muted)}

/* quick grid */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;transition:border-color .2s,transform .12s;overflow:hidden}
.qa:active{transform:scale(.98)}
.qa:hover{border-color:#3a414e}
.qa svg{width:28px;height:28px;stroke:var(--accent-2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.qa b{font-weight:600;font-size:15px;line-height:1.2;display:block}
.qa span{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
.qa.hot{background:linear-gradient(160deg,#20242d,#14171d);border-color:#3a2a2e}
.qa .new{position:absolute;top:12px;right:12px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--accent);padding:3px 6px;border-radius:5px}

/* service rail */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px)) 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.svc{flex:0 0 74%;max-width:300px;scroll-snap-align:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.svc .ico{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center}
.svc .ico svg{width:24px;height:24px;stroke:var(--accent-2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.svc b{font-size:15.5px;font-weight:600;line-height:1.2}
.svc p{margin:0;color:var(--muted);font-size:13px;line-height:1.35;flex:1}
.svc .from{font-family:var(--f-display);font-size:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.walkin{display:flex;gap:14px;align-items:flex-start}
.walkin .big{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.05;color:var(--accent-2);border:1.5px solid var(--accent);border-radius:12px;padding:8px 10px;text-align:center;flex:0 0 auto}
.walkin h3{margin:0 0 4px;font-size:16px}
.walkin p{margin:0;color:var(--muted);font-size:13.5px}

.boss{display:flex;gap:14px;align-items:center}
.ava{width:56px;height:56px;border-radius:50%;flex:0 0 auto;background:linear-gradient(135deg,#2b303b,#1b1f27);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;border:2px solid var(--accent)}
.boss q{display:block;font-size:14px;line-height:1.4;quotes:"«" "»"}
.boss small{color:var(--muted);font-size:12px}

.faq details{border-top:1px solid var(--line);padding:12px 0}
.faq details:first-of-type{border-top:0;padding-top:2px}
.faq summary{cursor:pointer;list-style:none;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.faq summary::after{content:"+";color:var(--muted);font-size:20px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq p{margin:8px 0 0;color:var(--muted);font-size:14px}
.cmp{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.cmp td,.cmp th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{color:var(--muted);font-weight:500}
.cmp td:last-child{color:var(--fg)}

.contacts{display:flex;flex-direction:column;gap:12px}
.addr{font-size:17px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip-link{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:13.5px;text-decoration:none;font-weight:500}
.chip-link svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.phone{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.phone b{font-family:var(--f-display);font-size:18px;user-select:all;white-space:nowrap}
.mini{font-size:12px;color:var(--muted)}

/* ========== constructor: coverage drawing (лекала) + element list ========== */
.pk-rail{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px)) 4px}
.pk-rail::-webkit-scrollbar{display:none}
.pk{flex:0 0 auto;width:150px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:3px;transition:border-color .2s,background .2s}
.pk b{font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.01em}
.pk .pp{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.pk span{font-size:12px;color:var(--muted);line-height:1.3}
.pk[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.draw{position:relative;background-color:var(--paper);background-image:linear-gradient(rgba(133,146,168,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(133,146,168,.07) 1px,transparent 1px);background-size:16px 16px;border:1px solid var(--line);border-radius:18px;padding:14px 12px 12px;display:flex;flex-direction:column;gap:12px}
.draw-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.legend i{width:18px;height:12px;border-radius:3px;border:1px solid #ff6b72;background:repeating-linear-gradient(45deg,rgba(227,38,47,.25) 0 3px,rgba(255,77,85,.85) 3px 4px)}
.heat-btn{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--muted)}
.heat-btn[aria-pressed="true"]{border-color:var(--warn);color:var(--warn)}
.views{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vw{margin:0}
.vw svg{width:100%;height:auto;display:block;touch-action:manipulation}
.vw figcaption{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);text-align:center;margin-top:4px}
.pz{fill:var(--panel);stroke:var(--ink);stroke-width:1;cursor:pointer;transition:fill .25s,stroke .25s;vector-effect:non-scaling-stroke}
.pz:hover{stroke:#c3cad6}
.pz.gz{fill:#222b38}
.pz.on{fill:url(#hatch);stroke:#ff6b72}
.matte .pz.on{fill:url(#hatchM)}
.colorfilm .pz.on{fill:var(--fc);stroke:#fff}
.pz.arc{fill:none;stroke:var(--ink-dim);stroke-width:3}
.pz.arc.on{fill:none;stroke:var(--accent-2);stroke-width:4}
.st{fill:#151a22;stroke:var(--ink-dim);stroke-width:.8;pointer-events:none;vector-effect:non-scaling-stroke}
.gl{fill:#1f2734;stroke:var(--ink-dim);stroke-width:.8;pointer-events:none;vector-effect:non-scaling-stroke}
.tl{fill:#4a1a1f;stroke:var(--ink-dim);stroke-width:.8;pointer-events:none}
.wh{fill:#07090c;stroke:var(--ink-dim);stroke-width:1;pointer-events:none}
.gnd{stroke:var(--ink-dim);stroke-width:.8;stroke-dasharray:4 3}
.dim{pointer-events:none}
.dim path{stroke:var(--film);stroke-width:.9;fill:none}
.dim text{fill:var(--film);font-family:var(--f-body);font-size:9px;font-weight:600}
.heat .pz{fill:#1a1f28}
.heat .pz[data-r="3"]{fill:rgba(227,38,47,.6)}
.heat .pz[data-r="2"]{fill:rgba(245,181,70,.42)}
.heat .pz[data-r="1"]{fill:rgba(133,146,168,.14)}
.heat .pz.arc[data-r="2"]{fill:none;stroke:rgba(245,181,70,.85)}
.heat .pz.on{stroke:#fff;stroke-width:1.8}
.heat-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.heat-legend span{display:flex;align-items:center;gap:5px}
.rk{width:8px;height:8px;border-radius:50%;flex:0 0 auto;display:inline-block}
.r3{background:var(--accent-2)}.r2{background:var(--warn)}.r1{background:#6b7586}
.stamp{display:grid;grid-template-columns:1.3fr 1fr 1fr;border:1px solid #333b49;border-radius:6px;overflow:hidden;font-size:12px}
.stamp div{padding:6px 8px;border-left:1px solid #333b49;min-width:0}
.stamp div:first-child{border-left:0}
.stamp small{display:block;color:var(--ink-dim);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}
.stamp b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 14px 4px}
.grp-h{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:13px 0 8px}
.it{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.it-n{min-width:0}
.it-n b{font-weight:500;font-size:14.5px;display:block;line-height:1.25}
.it-n span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
.it-p{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;white-space:nowrap;color:var(--dim)}
.it.on .it-p{color:var(--fg)}
.it.inpkg .it-p{color:var(--muted);text-decoration:line-through}
.it .inc{font-size:12px;color:var(--ok);font-weight:600}
.tg{width:46px;height:28px;border-radius:14px;background:#2a303b;position:relative;transition:background .2s;flex:0 0 auto}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#c9ced7;transition:transform .2s}
.tg[aria-pressed="true"]{background:var(--accent)}
.tg[aria-pressed="true"]::after{transform:translateX(18px);background:#fff}
.mseg{grid-column:1/-1;display:flex;gap:3px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.mseg button{flex:1;height:32px;border-radius:7px;font-size:12.5px;color:var(--muted)}
.mseg button[aria-pressed="true"]{background:var(--fg);color:#0c0e12;font-weight:600}
.finish{display:flex;gap:6px}
.finish button{flex:1;height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.finish button[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.fcolors{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fcolors button{width:30px;height:30px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1.5px var(--line)}
.fcolors button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.empty-sel{color:var(--muted);font-size:14px;padding:4px 0}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.summary{position:sticky;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:5;background:rgba(20,23,29,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #333a47;border-radius:18px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 18px 40px -18px #000}
.summary .tot{flex:1;min-width:0}
.summary .tot b{font-family:var(--f-display);font-size:22px;display:block;line-height:1.05}
.summary .tot span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gift{display:flex;gap:10px;align-items:center;font-size:13px;color:#ffd7d9;background:rgba(227,38,47,.1);border:1px dashed rgba(227,38,47,.45);border-radius:12px;padding:10px 12px}
.save{color:var(--ok)}
.tip{font-size:13px;color:var(--warn);background:rgba(245,181,70,.08);border:1px solid rgba(245,181,70,.25);border-radius:12px;padding:10px 12px}

/* ========== prices ========== */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.search input{flex:1;background:none;border:0;outline:0;height:100%;min-width:0}
.pcat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pcat>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;text-align:left}
.pcat>button b{font-size:15.5px;font-weight:600}
.pcat>button span{font-size:12.5px;color:var(--muted)}
.pcat>button svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .25s;flex:0 0 auto}
.pcat.open>button svg{transform:rotate(180deg)}
.pbody{display:none;padding:0 16px 14px}
.pcat.open .pbody{display:block}
.pitem{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pitem .n{font-size:14px;min-width:0}
.pitem .n small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.pitem .p{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600;font-size:14px}
.pitem .p.hot{color:var(--accent-2)}
.add{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;font-size:18px;line-height:1;transition:background .2s}
.add.in{background:var(--accent);border-color:var(--accent);color:#fff}
.add .ic{width:16px;height:16px}

/* ================= PPF CONSTRUCTOR ================= */
function itemPrice(id,v){ const it=ITEM[id]; if(!v) return 0; return it.opts ? it.opts[v-1][1] : it.price; }
function itemName(id,v){ const it=ITEM[id]; return it.opts && v ? `${it.name}: ${it.opts[v-1][0].toLowerCase()}` : it.name; }
// уровень покрытия элемента на схеме: 0 — нет, 1 — полоса/да, 2 — целиком
function level(id){
  const P=state.ppf;
  if(P.mode!=='custom'){
    if(FULL_EXTRA.has(id)) return P.sel[id]||0;
    if(id==='roof') return P.mode==='full160'?1:2;
    return ITEM[id].opts?2:1;
  }
  return P.sel[id]||0;
}
function ppfCalc(){
  const P=state.ppf;
  if(P.mode!=='custom'){
    const f=FULL[P.mode];
    const lines=ITEMS.filter(i=>FULL_EXTRA.has(i.id)&&P.sel[i.id]).map(i=>({key:i.id,name:itemName(i.id,P.sel[i.id]),price:itemPrice(i.id,P.sel[i.id])}));
    return {total:f.price+lines.reduce((s,l)=>s+l.price,0), full:f, base:f.price, lines, pkg:null, inPkg:new Set(), save:0, time:'от 3 дней', gifts:'Химчистка дисков, мойка люкс и антидождь всех стёкол — в подарок'};
  }
  const lines=ITEMS.filter(i=>P.sel[i.id]).map(i=>({key:i.id,name:itemName(i.id,P.sel[i.id]),price:itemPrice(i.id,P.sel[i.id])}));
  const raw=lines.reduce((s,l)=>s+l.price,0);
  let pkg=null;
  for(const k of ['premium','optima','light']){
    const set=PKG[k].set;
    if(Object.keys(set).every(id=> id==='hood' ? P.sel.hood===set.hood : !!P.sel[id])){ pkg=k; break; }
  }
  const inPkg=new Set(pkg?Object.keys(PKG[pkg].set):[]);
  const total = pkg ? raw - lines.filter(l=>inPkg.has(l.key)).reduce((s,l)=>s+l.price,0) + PKG[pkg].price : raw;
  let time='—';
  if(lines.length){
    if(pkg==='optima'||pkg==='premium'||lines.length>5) time='около суток';
    else if(P.sel.windshield) time='5–6 часов';
    else if(lines.length===1&&P.sel.headlights) time='около часа';
    else time='от 1 часа';
  }
  return {total, raw, lines, pkg, inPkg, time, save:pkg?raw-total:0, gifts:(pkg==='optima'||pkg==='premium')?'Антидождь передней полусферы — в подарок':''};

function plural(n,a,b,c){ n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20) return c; if(n1>1&&n1<5) return b; if(n1===1) return a; return c; }

function setItem(id,v){
  const P=state.ppf;
  if(P.mode!=='custom' && !FULL_EXTRA.has(id)){
    P.mode='custom'; const keep=P.sel; P.sel={};
    ITEMS.forEach(i=>{ if(!FULL_EXTRA.has(i.id)) P.sel[i.id]= i.opts?2:1; else if(keep[i.id]) P.sel[i.id]=keep[i.id]; });
  }
  if(v) P.sel[id]=v; else delete P.sel[id];
  haptic(v?'medium':'light');
  updatePPF();
}
function tapZone(id){
  const it=ITEM[id], cur=level(id);
  const next = it.opts ? (cur+1)%3 : (cur?0:1);
  setItem(id,next);

}
function applyPkg(k){
  const P=state.ppf;
  if(k==='clear'){ P.sel={}; P.mode='custom'; return; }
  if(FULL[k]){ const keep={}; FULL_EXTRA.forEach(x=>{ if(P.sel[x]) keep[x]=P.sel[x]; }); P.sel=keep; P.mode=k; return; }
  P.mode='custom'; P.sel=Object.assign({}, PKG[k].set);
}

    out.push({key:dt.toISOString().slice(0,10), d:dt.getUTCDate(), wd:dt.getUTCDay(), m:dt.getUTCMonth(), today:k===0});
  }
  return out;
}

function askWriteAccess(){
  return new Promise(res=>{
    try{
      if(store.get('wa',false) || !tg.requestWriteAccess || !(tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'))) return res();
      tg.requestWriteAccess(ok=>{ if(ok) store.set('wa',true); res(); });
      setTimeout(res,15000);
    }catch(e){ res(); }
  });
}
async function sendLead(text, lead){
  if(CONFIG.leadEndpoint && tg){
    await askWriteAccess();
    try{
      // text/plain — простой запрос без CORS-preflight
      const r = await fetch(CONFIG.leadEndpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({text, lead, initData:tg.initData})});
      if(r.ok) return 'sent';
    }catch(e){}
  }
  return 'chat';
}
function setSending(on){
  state.sending=on;
  const b=$('#submitBtn'); if(b){ b.disabled=on; b.textContent=on?'Отправляем…':'Записаться'; }

}
async function submitBooking(){
  if(state.sending) return;
  readForm();
  const digits=form.phone.replace(/\D/g,'');
  let ok=true;
  $('#f-name') && $('#f-name').classList.toggle('bad', !form.name.trim()); if(!form.name.trim()) ok=false;
  $('#f-phone') && $('#f-phone').classList.toggle('bad', digits.length!==11); if(digits.length!==11) ok=false;
  if(!ok){ haptic('heavy'); toast('Проверьте имя и телефон'); return; }
  const id = 'SRV-'+String(Date.now()).slice(-5);
  const text = bookingText(id);
  const lead = {id, name:form.name, phone:form.phone, car:form.car, day:form.day, time:form.time, comment:form.comment, src:state.src||'', total:cartTotal(), items:state.cart.map(i=>({title:i.title, price:i.price}))};
  setSending(true);
  const how = await sendLead(text, lead);
  setSending(false);
  state.submitted = {id, text, how, when: form.day, cart: state.cart.slice(), total: cartTotal()};
  store.set('form',{name:form.name,phone:form.phone,car:form.car});

  state.cart=[]; store.set('cart',[]); updateBadge();

}

function maskPhone(v){
  let d=v.replace(/\D/g,''); if(d.startsWith('8')) d='7'+d.slice(1); if(!d.startsWith('7')) d='7'+d; d=d.slice(0,11);
  let o='+7'; if(d.length>1) o+=' ('+d.slice(1,4); if(d.length>=4) o+=')'; if(d.length>4) o+=' '+d.slice(4,7); if(d.length>7) o+='-'+d.slice(7,9); if(d.length>9) o+='-'+d.slice(9,11);
  return o;
}

function render(){
  const v=$('#view');
  v.innerHTML = state.tab==='home'?renderHome(): state.tab==='ppf'?renderPPF(): state.tab==='prices'?renderPrices(state.q||''): renderBook();
  document.querySelectorAll('.nav button').forEach(b=>{ if(b.dataset.tab===state.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  bindView(); syncTG();
}
function go(tab){ if(state.tab===tab) return window.scrollTo({top:0,behavior:'smooth'}); readForm(); state.tab=tab; window.scrollTo(0,0); render(); haptic(); }
function goBack(){ if(state.sheet) return closeSheet(); if(state.tab!=='home') go('home'); }
function syncTG(){
  if(!tg) return;
  try{
    if(state.sheet || state.tab!=='home') tg.BackButton.show(); else tg.BackButton.hide();
    if(state.tab==='book' && state.cart.length && !state.submitted && !state.sheet){ tg.MainButton.setParams({text:'Записаться', color:'#e3262f', text_color:'#ffffff', is_active:true, is_visible:true}); }
    else tg.MainButton.hide();
  }catch(e){}
}
function updatePPF(){ const y=window.scrollY; $('#view').innerHTML=renderPPF(); bindView(); window.scrollTo(0,y); }

function bindView(){
  const v=$('#view');
  if(state.tab==='prices'){
    const q=$('#q'); q && q.addEventListener('input',()=>{ state.q=q.value; $('#cats').innerHTML=catsHTML(q.value.trim().toLowerCase()); });
  }
  if(state.tab==='book'){
    const ph=$('#in-phone'); ph && ph.addEventListener('input',()=>{ ph.value=maskPhone(ph.value); form.phone=ph.value; $('#f-phone').classList.remove('bad'); });
    ph && ph.addEventListener('focus',()=>{ if(!ph.value) ph.value='+7 ('; });
    const nm=$('#in-name'); nm && nm.addEventListener('input',()=>{ form.name=nm.value; $('#f-name').classList.remove('bad'); });
    ['car','comment'].forEach(k=>{ const e=$('#in-'+k); e && e.addEventListener('input',()=>form[k]=e.value); });
    const sb=$('#submitBtn'); sb && sb.addEventListener('click',submitBooking);
  }
}

/* global click delegation */
document.addEventListener('click', e=>{
  const t=e.target.closest('button, [data-z]'); if(!t) return;
  const d=t.dataset;
  if(t.closest('.nav') && d.tab) return go(d.tab);
  if(d.go){ if(state.sheet) closeSheet(); return go(d.go); }
  if(d.sheet) return openSheet(d.sheet);
  if(t.id==='sheetX') return closeSheet();
  if(d.cat){ state.openCat=d.cat; state.q=''; go('prices'); setTimeout(()=>{ const el=document.getElementById('cat-'+d.cat); el&&el.scrollIntoView({behavior:'smooth',block:'start'}) },60); return; }
  if(d.toggle){ state.openCat = state.openCat===d.toggle?null:d.toggle; const el=t.parentElement; el.classList.toggle('open'); t.setAttribute('aria-expanded', el.classList.contains('open')); return; }
  if(d.add){ if(inCart(d.add)){ removeCart(d.add); t.classList.remove('in'); t.innerHTML=I_PLUS; } else { addCart(itemById(d.add)); t.classList.add('in'); t.innerHTML=I_CHECK; } return; }
  if(d.addId!==undefined){ addCart(itemById(d.addId)); return; }
  if(d.addPromo!==undefined){ addCart(itemById('tint-0')); t.textContent='В записи'; return; }
  if(d.addWinter!==undefined){ if(inCart('winter')){ removeCart('winter'); t.classList.remove('in'); t.innerHTML=I_PLUS; } else { addCart({id:'winter',title:'Подготовка к зиме (подбор мастером)',price:null}); t.classList.add('in'); t.innerHTML=I_CHECK; } return; }
  if(d.addConsult!==undefined){ addCart({id:'consult',title:'Консультация мастера',price:null},true); render(); return; }
  if(d.del){ removeCart(d.del); render(); return; }
  if(d.copy){ copyText(d.copy); return; }
  if(d.copyText!==undefined){ copyText(state.submitted.text); return; }
  if(d.new!==undefined){ state.submitted=null; render(); return; }
  if(d.day){ readForm(); form.day=d.day; form.time=null; const y=window.scrollY; render(); window.scrollTo(0,y); haptic(); return; }
  if(d.time){ form.time=d.time; document.querySelectorAll('.time').forEach(b=>b.setAttribute('aria-pressed', b===t)); haptic(); return; }
  if(d.goPkg){ applyPkg(d.goPkg); go('ppf'); return; }

  // PPF
  if(d.z){ tapZone(d.z); return; }
  if(d.tog){ setItem(d.tog, level(d.tog)?0:1); return; }
  if(d.opt){ const [id,v]=d.opt.split(':'); setItem(id,+v); return; }
  if(d.pkg){ applyPkg(d.pkg); updatePPF(); haptic('medium'); return; }
  if(d.heat!==undefined){ state.ppf.heat=!state.ppf.heat; updatePPF(); return; }
  if(d.fc!==undefined){ state.ppf.filmColor=+d.fc; updatePPF(); haptic(); return; }
  if(d.fin){ if(d.fin==='color'){ applyPkg('color'); } else { state.ppf.finish=d.fin; if(state.ppf.mode==='color') state.ppf.mode='full180'; } updatePPF(); return; }
  if(d.ppfAdd!==undefined){ const c=ppfCalc(); addCart({id:'ppf-calc', title:ppfDescribe(), price:c.total}); updatePPF(); toast('Расчёт добавлен в запись'); return; }

  // quiz
  if(d.qa){ quiz.a[QUIZ[quiz.step].k]=d.qa; quiz.step++; refreshSheet(); $('#sheet').scrollTop=0; haptic(); return; }
  if(d.qback!==undefined){ quiz.step--; refreshSheet(); return; }
  if(d.qrestart!==undefined){ quiz.step=0; quiz.a={}; refreshSheet(); return; }
  if(d.rec){ const r=quizRecs().find(x=>x.id===d.rec); if(inCart(r.id)){ removeCart(r.id); } else addCart({id:r.id,title:r.title,price:r.price,fixed:r.fixed},true); refreshSheet(); return; }
  if(d.recAll!==undefined){ quizRecs().forEach(r=>{ if(!inCart(r.id)) addCart({id:r.id,title:r.title,price:r.price,fixed:r.fixed},true); }); closeSheet(); go('book'); toast('План добавлен в запись'); return; }
  // tint
  if(d.tz){ state.tintZone=d.tz; state.tintLevel = d.tz==='rear'?15:70; refreshSheet(); return; }
  if(d.tl){ state.tintLevel=+d.tl; $('#tintWrap').innerHTML=tintSVG(); $('#tintInfo').innerHTML=tintInfo(); document.querySelectorAll('[data-tl]').forEach(b=>b.setAttribute('aria-pressed', b===t)); haptic(); return; }
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.dataset && e.target.dataset.z){ e.preventDefault(); tapZone(e.target.dataset.z); }
  if(e.key==='Escape' && state.sheet) closeSheet();
});
$('#overlay').addEventListener('click',closeSheet);

async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); toast('Скопировано'); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Скопировано'); }catch(_){ toast('Выделите текст вручную'); } ta.remove(); }
}

/* boot */
initTG();
/* ссылки вида t.me/<бот>/app?startapp=ppf открывают нужный раздел; значение пишется в заявку как источник */
(function deepLink(){
  let sp='';
  try{ sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get('startapp') || ''; }catch(e){}
  sp = String(sp).replace(/[^\w-]/g,'').slice(0,60);
  if(!sp) return;
  state.src = sp;
  const tabs = {ppf:'ppf', prices:'prices', price:'prices', book:'book'};
  const cats = ['ceramic','polish','tint','dents','noise','clean','full','zones'];
  if(tabs[sp]) state.tab = tabs[sp];
  else if(cats.includes(sp)){ state.tab='prices'; state.openCat=sp; }
  else if(sp==='quiz' || sp==='tintfit') setTimeout(()=>openSheet(sp==='quiz'?'quiz':'tint'),350);
  else if(sp==='promo'){ state.tab='book'; if(PROMO_END-Date.now()>0 && !inCart('tint-0')) state.cart.push(itemById('tint-0')); }
})();
updateStatus(); setInterval(updateStatus, 60000);
setInterval(()=>{ const cd=document.getElementById('cd'); if(cd) cd.innerHTML=countdownHTML(); }, 1000);
updateBadge(); render();
</script>
</body>
</html>
